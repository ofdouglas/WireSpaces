name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    # Match the validated AVR GCC 7.3 toolchain and size budgets.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build nodejs python3-venv \
            gcc-avr avr-libc binutils-avr
          python3 -m venv .venv
          .venv/bin/python -m pip install -r tests/requirements.txt

      - name: Cache CMake dependency sources
        uses: actions/cache@v4
        with:
          # Generated subbuilds contain generator-specific CMake caches.
          path: build/_deps/googletest-src
          key: ${{ runner.os }}-cmake-sources-v1-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-cmake-sources-v1-

      - name: Run complete device-independent suite
        run: ./scripts/test.sh
