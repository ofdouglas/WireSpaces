# yaml-language-server: $schema=../../codegen/wiring.schema.json
# Topology only: no endpoints or authorization policy.
# CAN rates are illustrative: confirm arbitration/data timing for the actual system.
Hosts:
  - Name: Pc
    HostId: 1
    Interfaces: [UartVcp]
  - Name: Gateway
    HostId: 2
    Interfaces: [UartVcp, CanA, CanB, Multidrop]
  - Name: LeafA
    HostId: 3
    Interfaces: [CanA, CanB, Multidrop, RingA, RingC]
  - Name: LeafB
    HostId: 4
    Interfaces: [CanA, CanB, Multidrop, RingA, RingB]
  - Name: LeafC
    HostId: 5
    Interfaces: [CanA, CanB, Multidrop, RingB, RingC]

Links:
  - {Name: UartVcp, LinkType: UART_HDLC, BaudRate: 115200}
  - {Name: CanA, LinkType: CAN_FD, ArbitrationBitrate: 500000, DataBitrate: 2000000}
  - {Name: CanB, LinkType: CAN_FD, ArbitrationBitrate: 500000, DataBitrate: 2000000}
  - {Name: Multidrop, LinkType: UART_HDLC, BaudRate: 115200}
  - {Name: RingA, LinkType: UART_HDLC, BaudRate: 115200}
  - {Name: RingB, LinkType: UART_HDLC, BaudRate: 115200}
  - {Name: RingC, LinkType: UART_HDLC, BaudRate: 115200}

Groups:
  Leaves: [LeafA, LeafB, LeafC]

Paths:
  LongBenchPath:
    - Pc.UartVcp
    - Gateway.UartVcp
    - Gateway.CanA
    - LeafA.CanA
    - LeafA.RingA
    - LeafB.RingA
    - LeafB.RingB
    - LeafC.RingB

Wires:
  - Name: LongBenchTest
    WireId: 40
    Hosts: [Pc, LeafC]
    Path: LongBenchPath
  - Name: CanATest
    WireId: 2
    Hosts: [Pc]
    Groups: [Leaves]
    Links: [UartVcp, CanA]
  - Name: CanBTest
    WireId: 3
    Hosts: [Pc]
    Groups: [Leaves]
    Links: [UartVcp, CanB]
  - Name: MultidropTest
    WireId: 4
    Hosts: [Pc]
    Groups: [Leaves]
    Links: [UartVcp, Multidrop]
  - Name: RingCTest
    WireId: 5
    Hosts: [LeafA, LeafC]
    Links: [RingC]
